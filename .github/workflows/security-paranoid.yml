name: Security Paranoid

on:
  schedule:
    - cron: '11 3 * * 6'
  workflow_dispatch:

concurrency:
  group: security-paranoid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 9.1.4
  NODE_VERSION: '20'

jobs:
  paranoid_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all workspaces
        run: pnpm lint

      - name: Reject forbidden memory patterns in core
        run: |
          if grep -rn --include='*.ts' 'Buffer\.allocUnsafe' packages/core/src/; then
            echo "ERROR: Buffer.allocUnsafe is forbidden in packages/core/src/ — use Buffer.alloc"
            exit 1
          fi

      - name: Build all workspaces
        run: pnpm build

      - name: Run full test suite
        run: pnpm test

      - name: Run coverage suite
        run: pnpm test:coverage

      - name: Run chaos and invariant suite
        run: pnpm test:chaos

      - name: Verify publish packages
        run: node scripts/release/verify-publish-packages.mjs

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: paranoid-coverage
          path: coverage
          if-no-files-found: error

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: release-package-verification
          path: security/artifacts/generated/release-packages
          if-no-files-found: error

  supply_chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SBOM
        uses: anchore/sbom-action@57aae528053a48a3f6235f2d9461b05fbcb7366d # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan SBOM for high vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high

      - name: Audit production dependencies
        run: pnpm audit --prod

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: paranoid-sbom
          path: sbom.spdx.json
          if-no-files-found: error
