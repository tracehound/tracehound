name: Release

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: npm dist-tag (latest, next, beta, etc.)
        required: true
        default: latest
        type: string
      publish_core:
        description: Publish @tracehound/core
        required: true
        default: true
        type: boolean
      publish_express:
        description: Publish @tracehound/express
        required: true
        default: true
        type: boolean
      publish_fastify:
        description: Publish @tracehound/fastify
        required: true
        default: true
        type: boolean
      publish_cli:
        description: Publish @tracehound/cli
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  PNPM_VERSION: 10.33.0
  NODE_VERSION: '20'

jobs:
  release_boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Fetch dependencies
        run: pnpm fetch --frozen-lockfile

      - name: Install dependencies offline
        run: pnpm install --offline --frozen-lockfile

      - run: pnpm lint
      - run: pnpm build

      - name: Verify publish packages
        run: node scripts/release/verify-publish-packages.mjs
        env:
          TRACEHOUND_RELEASE_LABEL: release-${{ github.sha }}

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: release-package-verification
          path: security/artifacts/generated/release-packages
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [release_boundary]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Fetch dependencies
        run: pnpm fetch --frozen-lockfile

      - name: Install dependencies offline
        run: pnpm install --offline --frozen-lockfile

      - name: Publish @tracehound/core
        if: ${{ inputs.publish_core }}
        working-directory: packages/core
        run: npm publish --access public --tag ${{ inputs.npm_tag }}

      - name: Publish @tracehound/express
        if: ${{ inputs.publish_express }}
        working-directory: packages/express
        run: npm publish --access public --tag ${{ inputs.npm_tag }}

      - name: Publish @tracehound/fastify
        if: ${{ inputs.publish_fastify }}
        working-directory: packages/fastify
        run: npm publish --access public --tag ${{ inputs.npm_tag }}

      - name: Publish @tracehound/cli
        if: ${{ inputs.publish_cli }}
        working-directory: packages/cli
        run: npm publish --access public --tag ${{ inputs.npm_tag }}
