name: OSV-Scanner Full Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: '12 12 * * 1'
  workflow_dispatch:

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan-scheduled:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8ae4be80636b94886b3c271caad730985ce0611c # v2.3.3
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
