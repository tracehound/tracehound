name: tracehound-codeql-strict

paths:
  - packages
  - docs
  - security

paths-ignore:
  - '**/*.test.ts'
  - '**/tests/**'
  - '**/scenarios/**'
  - '**/*.md'
  - '**/*.mdx'
  - '**/*.snap'
  - '**/dist/**'
  - '**/coverage/**'

queries:
  - uses: security-extended
  - uses: security-and-quality

query-filters:
  - exclude:
      problem.severity:
        - warning
      precision:
        - low
  - include:
      tags:
        - security
