name: CI-Main

on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 9.1.4

jobs:
  test_full:
    name: test_full (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Reject forbidden memory patterns in core
        run: |
          if grep -rn --include='*.ts' 'Buffer\.allocUnsafe' packages/core/src/; then
            echo "ERROR: Buffer.allocUnsafe is forbidden in packages/core/src/ — use Buffer.alloc"
            exit 1
          fi
      - run: pnpm build
      - run: pnpm test

  secrets_full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
